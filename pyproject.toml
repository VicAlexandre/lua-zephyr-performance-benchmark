[project]
name = "lua-zephyr-performance-benchmark"
version = "0.1.0"
description = "Performance benchmark of the lua_zephyr concurrency models on the Zbook (RP2350B)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "west>=1.5",
    "nox>=2025.5",
    "pyelftools>=0.29",
    "PyYAML>=6.0",
    "pykwalify",
    "jsonschema",
    "canopen",
    "packaging",
    "patool>=2.0.0",
    "psutil>=5.6.6",
    "pylink-square",
    "pyserial",
    "requests>=2.33.0",
    "semver",
    "tqdm>=4.67.1",
    "reuse>=6.0.0",
    "spdx-python-model>=0.0.5",
    "anytree",
    "tabulate",
    "intelhex",
    "numpy>=2.5.4",
    "matplotlib>=3.11.2",
]

[tool.uv]
package = false
